<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fishing World" />
    <meta name="theme-color" content="#0e2a33" />
    <title>Fishing World Online</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b1d22; overflow: hidden; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      @supports (height: 100dvh) { #game { height: 100dvh; } }
      #fullscreen-button { position: fixed; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 12;
        border: 1px solid #409b9b; border-radius: 18px; padding: 8px 14px; background: #0b2935e8; color: #e6f3ef; font: 600 12px system-ui; touch-action: manipulation; }
      #fullscreen-button[hidden], #fullscreen-help[hidden] { display: none; }
      #fullscreen-help { position: fixed; top: max(46px, calc(env(safe-area-inset-top) + 42px)); left: 50%; transform: translateX(-50%); z-index: 12;
        width: min(340px, 80vw); padding: 14px; border-radius: 12px; background: #0b2935f5; color: #e6f3ef; font: 14px/1.5 system-ui; text-align: center; }
      canvas { touch-action: none; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b1d22; color: #cfe7ea; align-items: center; justify-content: center;
                 text-align: center; padding: 24px; font: 600 20px 'Be Vietnam Pro', system-ui, sans-serif; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfe7ea;
              font: 600 18px 'Be Vietnam Pro', system-ui, sans-serif; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="rotate">Xoay ngang điện thoại để chơi Fishing World Online</div>
    <div id="boot">Đang tải Fishing World Online…</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
